apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          image: registry.example.com/api:1.4.2
          securityContext:
            privileged: false
            runAsNonRoot: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
